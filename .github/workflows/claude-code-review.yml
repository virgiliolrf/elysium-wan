name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Factory PRs are drafts while a milestone is in progress; they leave draft only for a VERIFIED tree.
    # Only PRs opened from this repository: a fork's PR has no access to the review token.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an adversarial reviewer for this pull request. Read CLAUDE.md first; if they exist, read
            docs/design/DESIGN.md and the docs/design/SPEC-*.md files the change touches — they are normative.

            Your checkout is NOT the PR head everywhere. Before you start, this action restores .claude/, CLAUDE.md,
            CLAUDE.local.md, .mcp.json, .claude.json, .gitmodules, .ripgreprc and .husky from the BASE branch (a safety
            measure). Every other file is the PR head. For those paths, read the PR's change only from `gh pr diff`. Never
            compare your local copy of them with the diff, and never conclude the PR reverts or hand-edits them because
            your copy differs. A regenerated .claude/workflows/*.js is expected when the same diff changes
            agents-architetura/tools/wf/src or agents-architetura/tools/wf/lib.

            Report only blocker and major findings: correctness bugs, races, violated invariants (INV-*),
            changes outside the owning workstream's paths, weakened tests or gates, hand-edited files under
            .claude/workflows/ (they are generated from agents-architetura/tools/wf/src), and claims in docs that the code or
            measurements do not support. No style nits, no praise.

            For each finding, post an inline comment on the exact line with mcp__github_inline_comment__create_inline_comment
            stating the defect, a concrete failing scenario, and the fix. Finish with one `gh pr comment` summary
            listing the findings by severity, or stating that none survived verification.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
